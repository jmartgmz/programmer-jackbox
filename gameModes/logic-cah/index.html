<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Logic CAH Multiplayer</title>
        <script src="/socket.io/socket.io.js"></script>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: 20px;
                font-family: Arial, sans-serif;
                background: #202124;
                color: white;
            }

            h1,
            h2,
            h3 {
                margin-top: 0;
            }

            .top-bar {
                margin-bottom: 16px;
            }

            #room-info {
                color: #d7dadc;
                margin-top: 8px;
                font-size: 15px;
            }

            #info-label {
                color: #d7dadc;
                margin-top: 8px;
                line-height: 1.4;
                max-width: 1100px;
            }

            .prompt-panel {
                margin-bottom: 16px;
            }

            .prompt-box {
                background: #111111;
                border: 2px solid #333;
                border-radius: 8px;
                padding: 18px;
                white-space: pre-line;
                font-weight: bold;
                line-height: 1.5;
                min-height: 120px;
            }

            .main-layout {
                display: flex;
                gap: 16px;
                align-items: stretch;
            }

            .left-panel {
                width: 280px;
                background: #2c2f33;
                border-radius: 8px;
                padding: 16px;
                flex-shrink: 0;
            }

            .right-panel {
                flex: 1;
                min-height: 450px;
            }

            #status-label {
                color: #8ab4f8;
                font-weight: bold;
                margin-bottom: 8px;
                font-size: 18px;
            }

            #timer-label {
                color: #fbbc04;
                font-weight: bold;
                margin-bottom: 12px;
                min-height: 20px;
            }

            .card {
                background: #2c2f33;
                border-radius: 8px;
                padding: 16px;
                margin-bottom: 12px;
            }

            .prompt-label {
                font-weight: bold;
                line-height: 1.4;
            }

            .answer-box {
                width: 100%;
                min-height: 90px;
                resize: vertical;
                font-size: 15px;
                margin-top: 10px;
                border-radius: 6px;
                border: 1px solid #555;
                padding: 10px;
                font-family: Arial, sans-serif;
            }

            .primary-btn,
            .secondary-btn,
            .choice-btn {
                border: none;
                border-radius: 6px;
                padding: 10px 16px;
                font-weight: bold;
                cursor: pointer;
            }

            .primary-btn {
                background: #22c55e;
                color: white;
            }

            .secondary-btn {
                background: #3b82f6;
                color: white;
            }

            .choice-btn {
                background: #3b82f6;
                color: white;
                margin-top: 12px;
            }

            .bottom-row {
                margin-top: 18px;
                display: flex;
                justify-content: flex-end;
                gap: 10px;
            }

            .submission-title {
                font-size: 18px;
                font-weight: bold;
                margin-bottom: 12px;
            }

            .submission-block {
                white-space: pre-line;
                line-height: 1.5;
                color: #f3f4f6;
            }

            .winner-title {
                margin-top: 0;
            }

            .winner-points {
                margin-top: 8px;
            }

            .score-line {
                margin-bottom: 8px;
            }

            .score-divider {
                border-color: #444;
            }

            a {
                text-decoration: none;
            }

            @media (max-width: 900px) {
                .main-layout {
                    flex-direction: column;
                }

                .left-panel {
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <div class="top-bar">
            <h1>Cards Against Humanity</h1>
            <div id="room-info"></div>
            <div id="info-label"></div>
        </div>

        <div class="prompt-panel">
            <h3>Current Prompts</h3>
            <div id="prompt-box" class="prompt-box">Waiting for game to start...</div>
        </div>

        <div class="main-layout">
            <div class="left-panel">
                <h3>Scoreboard</h3>
                <div id="scoreboard">No game data yet.</div>
            </div>

            <div class="right-panel">
                <div id="status-label"></div>
                <div id="timer-label"></div>
                <div id="dynamic-container"></div>
            </div>
        </div>

        <div class="bottom-row">
            <button type="button" class="secondary-btn" onclick="leaveGame()">Leave Game (Return to Lobby)</button>
            <a href="/"><button type="button" class="secondary-btn">Leave Room</button></a>
        </div>

        <script src="logic-cah-client.js"></script>
    </body>
</html>
