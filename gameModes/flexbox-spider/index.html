<!doctype html>
<html>
    <head>
        <title>Flexbox Spider</title>
        <link rel="stylesheet" href="/flexbox-spider/flexbox-spider.css" />
    </head>
    <body>
        <h2>🕷️ Flexbox Spider</h2>

        <!-- GAME SCREEN -->
        <div id="game-screen">
            <div id="level-header">
                <span id="level-label">Level 1 / 10</span>
            </div>

            <p id="level-desc">Loading...</p>
            <p id="level-hint" class="hint"></p>

            <!-- Visual Web -->
            <div id="web-wrapper">
                <div id="target-container">
                    <div id="target-web">🕸️</div>
                </div>
                <div id="web-container">
                    <div id="spider">🕷️</div>
                </div>
            </div>

            <!-- CSS Editor -->
            <div id="editor-area">
                <div id="editor-label">/* Type your CSS property below */</div>
                <div id="css-rule-wrapper">
                    <span class="css-selector" id="css-selector-label">#web-container {</span>
                    <textarea
                        id="css-input"
                        placeholder="  justify-content: flex-end;"
                        spellcheck="false"
                        autocorrect="off"
                        autocomplete="off"
                        autocapitalize="off"
                        rows="3"
                    ></textarea>
                    <span class="css-close">}</span>
                </div>
            </div>

            <div id="feedback" class="hidden"></div>

            <div id="action-buttons">
                <button onclick="applyCSS()">Apply 🕷️</button>
                <button id="next-btn" class="hidden" onclick="nextLevel()">Next Level →</button>
                <a href="/"><button type="button">Main Menu</button></a>
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="hidden">
            <h3>🎉 You Did It!</h3>
            <p>You wrangled all 10 flexbox spiders onto their webs!</p>
            <div id="result-box">
                <p>Levels Completed: <b id="res-levels"></b></p>
            </div>
            <div class="buttons-row">
                <button onclick="restartGame()">Play Again</button>
                <a href="/"><button type="button">Main Menu</button></a>
            </div>
        </div>

        <script src="flexbox-spider.js"></script>
    </body>
</html>
